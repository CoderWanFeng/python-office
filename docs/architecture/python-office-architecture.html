:root {
  --loop: 3000ms;
  --ink: #212020;
  --paper: #f8f5e8;
  --sage: #f0f1e0;
  --butter: #f9f3d1;
  --peach: #f8e9d9;
  --lavender: #e9e1ea;
  --mist: #eef2f4;
  --kraft: #e9dac1;
  --card: #faf7eb;
  --font-title: 'Comic Sans MS','Kalam','LXGW WenKai Screen','Kaiti SC',cursive;
  --font-body: 'Comic Sans MS','PatrickHand','LXGW WenKai Screen','Kaiti SC',cursive;
  --dot-sage: #5f7a4a;
  --dot-butter: #b8912a;
  --dot-peach: #bf7350;
  --dot-lavender: #7d6a99;
  --dot-mist: #5b7d94;
}
body { margin: 0; background: var(--paper); font-family: var(--font-body); }
.canvas { width: 1200px; margin: 0 auto; }
svg { display: block; }
svg text { font-family: var(--font-body); fill: var(--ink); }
.t-title { font-family: var(--font-title); font-weight: 700; }
.t-strong { font-family: var(--font-title); font-weight: 700; }
.t-weak  { opacity: 0.65; }
.mono { font-family: ui-monospace, Menlo, monospace; }

/* === flow dots === */
.dot { offset-rotate: 0deg; transform-box: fill-box; transform-origin: center;
       animation: travel var(--t, var(--loop)) linear infinite,
                  breathe calc(var(--loop) / 4) ease-in-out infinite; }
@keyframes travel { from { offset-distance: 0%; } to { offset-distance: 100%; } }
@keyframes breathe { 50% { transform: scale(1.35); } }
.d2 { animation-delay: calc(var(--loop) / -3); }
.d3 { animation-delay: calc(var(--loop) * -2 / 3); }

/* === micro animations === */
.spin { transform-box: fill-box; transform-origin: center;
        animation: spin var(--loop) linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.pulse { transform-box: fill-box; transform-origin: center;
         animation: pulse calc(var(--loop) / 2) ease-in-out infinite; }
@keyframes pulse { 50% { transform: scale(1.25) rotate(10deg); } }
.tick { stroke-dasharray: 26; animation: draw var(--loop) ease-in-out infinite; }
@keyframes draw { 0% { stroke-dashoffset: 26; } 40%,70% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: -26; } }
.blink { animation: blink calc(var(--loop) / 4) steps(2) infinite; }
@keyframes blink { 50% { opacity: 0; } }

</style>
</head>

<script>// sketchify.js — 把带 data-rough 的 SVG 元素替换成 rough.js 手绘版本
// 支持 rect(含 rx)/line/circle/ellipse/path；原元素保留（隐藏描边）以保住 marker 箭头和 offset-path 引用
function sketchify(root = document) {
  root.querySelectorAll('svg').forEach(svg => {
    const rc = rough.svg(svg);
    let seed = 7; // 固定种子：每次打开抖动一致，GIF 帧间不闪
    svg.querySelectorAll('[data-rough]').forEach(el => {
      const attr = n => el.getAttribute(n);
      const stroke = attr('stroke') || 'none';
      const fill = attr('fill');
      const o = {
        roughness: +(el.dataset.roughness || 1.1),
        bowing: 0.9,
        seed: seed++,
        stroke,
        strokeWidth: +(attr('stroke-width') || 1.5),
        fill: fill && fill !== 'none' ? fill : undefined,
        fillStyle: 'solid',
        strokeLineDash: (attr('stroke-dasharray') || '').split(/[ ,]+/).filter(Boolean).map(Number),
      };
      const num = n => +attr(n);
      let node;
      switch (el.tagName) {
        case 'rect': {
          const x = num('x'), y = num('y'), w = num('width'), h = num('height');
          const r = Math.min(num('rx') || 0, w / 2, h / 2);
          node = r > 0
            ? rc.path(`M${x + r} ${y} h${w - 2 * r} a${r} ${r} 0 0 1 ${r} ${r} v${h - 2 * r} a${r} ${r} 0 0 1 -${r} ${r} h${-(w - 2 * r)} a${r} ${r} 0 0 1 -${r} -${r} v${-(h - 2 * r)} a${r} ${r} 0 0 1 ${r} -${r} z`, o)
            : rc.rectangle(x, y, w, h, o);
          break;
        }
        case 'line': node = rc.line(num('x1'), num('y1'), num('x2'), num('y2'), o); break;
        case 'circle': node = rc.circle(num('cx'), num('cy'), 2 * num('r'), o); break;
        case 'ellipse': node = rc.ellipse(num('cx'), num('cy'), 2 * num('rx'), 2 * num('ry'), o); break;
        case 'path': node = rc.path(attr('d'), o); break;
        default: return;
      }
      el.parentNode.insertBefore(node, el); // 原元素在上层：marker 箭头盖在手绘线之上
      el.setAttribute('fill', 'none');
      el.setAttribute('stroke', 'transparent'); // transparent 而非 none：保证 marker 仍渲染
    });
  });
}
</script>
<script>sketchify()</script>
